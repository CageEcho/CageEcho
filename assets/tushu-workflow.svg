<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" role="img" aria-labelledby="title"><title id="title">攻略到地图</title><rect width="560" height="340" rx="14" fill="#f4f8ff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="12" fill="#7e8b9e" letter-spacing="1">流程示意 / 攻略到地图</text><text x="30" y="79" font-size="23" font-weight="650" fill="#172a44">收藏的攻略，成为可操作的行程</text><rect x="30" y="104" width="500" height="150" rx="12" fill="#eaf1e8"/><path d="M30 160H530M90 104L250 254M220 104L370 254M410 104L310 254" stroke="white" stroke-width="16"/><path d="M100 201Q180 118 280 182T456 135" fill="none" stroke="#3985e8" stroke-width="4" stroke-dasharray="8 5"/><circle cx="100" cy="201" r="21" fill="#2465df" stroke="white" stroke-width="3"/><text x="100" y="207" text-anchor="middle" font-size="17" fill="white">1</text><circle cx="280" cy="182" r="21" fill="#2465df" stroke="white" stroke-width="3"/><text x="280" y="188" text-anchor="middle" font-size="17" fill="white">2</text><circle cx="456" cy="135" r="21" fill="#2465df" stroke="white" stroke-width="3"/><text x="456" y="141" text-anchor="middle" font-size="17" fill="white">3</text><text x="30" y="291" font-size="17" fill="#23446d">攻略解析 → 地点确认 → 按天动线 → 导航交付</text><text x="30" y="320" font-size="12" fill="#70849f">保留原有分天与顺序，支持纠错与长图导出。</text></g></svg>