<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" role="img" aria-labelledby="title"><title id="title">行策人机协同</title><rect width="560" height="340" rx="14" fill="#f4f8ff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="12" fill="#7e8b9e" letter-spacing="1">流程示意 / 行策人机协同</text><text x="30" y="79" font-size="23" font-weight="650" fill="#172a44">从需求到顾问可核验的方案</text><rect x="30" y="116" width="112" height="132" rx="10" fill="white" stroke="#dde7f5"/><circle cx="86" cy="154" r="18" fill="#eaf2ff"/><text x="86" y="160" text-anchor="middle" font-size="15" fill="#2465df">1</text><text x="86" y="198" text-anchor="middle" font-size="17" font-weight="600" fill="#23446d">需求补全</text><text x="86" y="227" text-anchor="middle" font-size="12" fill="#8191a7">必填项与追问</text><text x="149" y="185" font-size="18" fill="#8caadd">›</text><rect x="160" y="116" width="112" height="132" rx="10" fill="white" stroke="#dde7f5"/><circle cx="216" cy="154" r="18" fill="#eaf2ff"/><text x="216" y="160" text-anchor="middle" font-size="15" fill="#2465df">2</text><text x="216" y="198" text-anchor="middle" font-size="17" font-weight="600" fill="#23446d">资源检索</text><text x="216" y="227" text-anchor="middle" font-size="12" fill="#8191a7">候选池内选择</text><text x="279" y="185" font-size="18" fill="#8caadd">›</text><rect x="290" y="116" width="112" height="132" rx="10" fill="white" stroke="#dde7f5"/><circle cx="346" cy="154" r="18" fill="#eaf2ff"/><text x="346" y="160" text-anchor="middle" font-size="15" fill="#2465df">3</text><text x="346" y="198" text-anchor="middle" font-size="17" font-weight="600" fill="#23446d">行程编排</text><text x="346" y="227" text-anchor="middle" font-size="12" fill="#8191a7">约束条件校验</text><text x="409" y="185" font-size="18" fill="#8caadd">›</text><rect x="420" y="116" width="112" height="132" rx="10" fill="white" stroke="#dde7f5"/><circle cx="476" cy="154" r="18" fill="#eaf2ff"/><text x="476" y="160" text-anchor="middle" font-size="15" fill="#2465df">4</text><text x="476" y="198" text-anchor="middle" font-size="17" font-weight="600" fill="#23446d">顾问确认</text><text x="476" y="227" text-anchor="middle" font-size="12" fill="#8191a7">关键事项审核</text><text x="30" y="294" fill="#70849f" font-size="14">模型负责组织方案，规则与人工确认重要信息。</text></g></svg>